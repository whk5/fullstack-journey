<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day 3 · 静态文件测试页</title>
  <link rel="icon" href="./pixel.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <h1>静态文件服务器测试页</h1>
    <p>能看到样式、图片，按钮也能用，说明服务器按扩展名返回了正确的 Content-Type。</p>
    <p class="asset">
      <img src="./pixel.png" alt="1×1 测试图片" width="16" height="16" />
      1×1 png（放大成 16×16 显示）
    </p>
    <button id="load">加载 data.json</button>
    <pre id="output">点击按钮验证服务器对 .json 的处理（加分项）。</pre>
  </main>
  <script src="./app.js"></script>
</body>
</html>
