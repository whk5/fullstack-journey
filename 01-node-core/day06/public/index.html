<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day 6 · TODO API 调试台</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222c;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #8b929e;
      --accent: #5eead4;
      --accent-dim: #14b8a6;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
      --mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
      --sans: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2a28 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1a1f2e 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }

    header { margin-bottom: 28px; }

    .eyebrow {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 8px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .sub code {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      background: rgba(94, 234, 212, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .method {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .method.get { background: rgba(74, 222, 128, 0.15); color: var(--ok); }
    .method.post { background: rgba(251, 191, 36, 0.15); color: var(--warn); }
    .method.delete { background: rgba(248, 113, 113, 0.15); color: var(--err); }

    form { display: flex; gap: 10px; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus { border-color: var(--accent-dim); }

    input[type="text"]::placeholder { color: var(--muted); }

    button {
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #042f2a;
    }

    .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .toolbar h2 { margin: 0; }

    ul#todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li.todo {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      animation: rise 0.25s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    .todo .id {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      min-width: 2ch;
    }

    .todo .title { flex: 1; font-size: 15px; }

    .todo .badge {
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(139, 146, 158, 0.15);
      color: var(--muted);
    }

    .todo .badge.done {
      background: rgba(74, 222, 128, 0.12);
      color: var(--ok);
    }

    .btn-del {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .btn-del:hover:not(:disabled) {
      color: var(--err);
      border-color: var(--err);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 28px 0;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    #status {
      font-family: var(--mono);
      font-size: 13px;
      min-height: 1.5em;
      margin-top: 14px;
      color: var(--muted);
      word-break: break-all;
    }

    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }

    #status .code {
      font-weight: 700;
      margin-right: 8px;
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .hint kbd {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Day 6 · In-memory TODO</p>
      <h1>TODO API 调试台</h1>
      <p class="sub">页面与接口同源（<code>localhost:3032</code>），用 <code>fetch</code> 调接口；状态码直接打在下方，重点看创建是不是 <code>201</code>、删除路径带 id。</p>
    </header>

    <section class="card">
      <h2><span class="method post">POST</span> /todos · 创建</h2>
      <form id="create-form">
        <input id="title" type="text" placeholder="输入标题，例如：重读 Anatomy" autocomplete="off" required />
        <button class="btn-primary" type="submit" id="create-btn">创建</button>
      </form>
      <p class="hint">空标题 → 服务端 <kbd>400</kbd>；创建成功 → <kbd>201</kbd> + 自增 id；删除 → <kbd>DELETE /todos/:id</kbd></p>
      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2><span class="method get">GET</span> /todos · 列表</h2>
        <button class="btn-ghost" type="button" id="refresh-btn">刷新</button>
      </div>
      <ul id="todo-list"></ul>
      <div class="empty" id="empty" hidden>暂无数据 —— 先在上面创建一条</div>
    </section>
  </div>

  <script>
    const form = document.getElementById('create-form');
    const titleInput = document.getElementById('title');
    const createBtn = document.getElementById('create-btn');
    const refreshBtn = document.getElementById('refresh-btn');
    const listEl = document.getElementById('todo-list');
    const emptyEl = document.getElementById('empty');
    const statusEl = document.getElementById('status');

    function setStatus(ok, code, message) {
      statusEl.className = ok ? 'ok' : 'err';
      statusEl.innerHTML = '<span class="code">' + code + '</span>' + message;
    }

    function render(todos) {
      listEl.innerHTML = '';
      emptyEl.hidden = todos.length > 0;
      for (const todo of todos) {
        const li = document.createElement('li');
        li.className = 'todo';

        const id = document.createElement('span');
        id.className = 'id';
        id.textContent = '#' + todo.id;

        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = todo.title;

        const badge = document.createElement('span');
        badge.className = 'badge' + (todo.done ? ' done' : '');
        badge.textContent = todo.done ? 'done' : 'open';

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn-del';
        del.textContent = '删除';
        del.addEventListener('click', () => deleteTodo(todo.id));

        li.append(id, title, badge, del);
        listEl.appendChild(li);
      }
    }

    async function deleteTodo(id) {
      try {
        const res = await fetch('/todos/' + id, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok) {
          setStatus(true, res.status, 'DELETE /todos/' + id + ' · 已删 #' + data.deleted);
          await loadTodos();
        } else {
          setStatus(false, res.status, data.error || '删除失败');
        }
      } catch (err) {
        setStatus(false, 'ERR', err.message + '（服务起来了吗？）');
      }
    }

    async function loadTodos() {
      try {
        const res = await fetch('/todos');
        const data = await res.json();
        if (!res.ok) {
          setStatus(false, res.status, data.error || '加载失败');
          return;
        }
        setStatus(true, res.status, 'GET /todos · ' + data.length + ' 条');
        render(data);
      } catch (err) {
        setStatus(false, 'ERR', err.message + '（服务起来了吗？）');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      if (!title) {
        setStatus(false, '本地', '先输入标题');
        return;
      }

      createBtn.disabled = true;
      try {
        const res = await fetch('/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        const data = await res.json();
        if (res.status === 201) {
          setStatus(true, res.status, '已创建 #' + data.id + ' —— 注意是 201 不是 200');
          titleInput.value = '';
          await loadTodos();
        } else {
          setStatus(false, res.status, data.error || '创建失败');
        }
      } catch (err) {
        setStatus(false, 'ERR', err.message + '（服务起来了吗？）');
      } finally {
        createBtn.disabled = false;
      }
    });

    refreshBtn.addEventListener('click', loadTodos);
    loadTodos();
  </script>
</body>
</html>
